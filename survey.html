<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        p {
            text-align: center;
            color: #555;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 100px;
        }

        fieldset {
            margin-top: 15px;
            border: none;
            padding: 0;
        }

        legend {
            font-weight: bold;
        }

        button {
            margin-top: 20px;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="title">Survey Form</h1>
        <p id="description">We appreciate your feedback. Please fill out this form to help us improve.</p>

        <form id="survey-form">
            <label for="name" id="name-label">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
            
            <label for="email" id="email-label">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            
            <label for="number" id="number-label">Age:</label>
            <input type="number" id="number" name="number" min="0" max="120" placeholder="Enter your age" required>
            
            <label for="dropdown">Favorite Programming Language:</label>
            <select id="dropdown" name="language">
                <option value="javascript">JavaScript</option>
                <option value="python">Python</option>
                <option value="java">Java</option>
                <option value="csharp">C#</option>
            </select>
            
            <fieldset>
                <legend>Preferred Contact Method:</legend>
                <label>
                    <input type="radio" name="contact" value="email" required>
                    Email
                </label>
                <label>
                    <input type="radio" name="contact" value="phone">
                    Phone
                </label>
            </fieldset>

            <fieldset>
                <legend>Skills:</legend>
                <label>
                    <input type="checkbox" name="skills" value="html">
                    HTML
                </label>
                <label>
                    <input type="checkbox" name="skills" value="css">
                    CSS
                </label>
                <label>
                    <input type="checkbox" name="skills" value="javascript">
                    JavaScript
                </label>
            </fieldset>

            <label for="comments">Additional Comments:</label>
            <textarea id="comments" name="comments" placeholder="Any additional feedback?"></textarea>

            <button type="submit" id="submit">Submit</button>
        </form>
    </div>
</body>
</html>
